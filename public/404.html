<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agora Media</title>
    <script>
      // SPA fallback for GitHub Pages (rafgraph/spa-github-pages technique).
      // Rewrites a deep-link 404 into a query the app decodes on load.
      // pathSegmentsToKeep = 1 keeps the /agoramedia/ project-site prefix.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
